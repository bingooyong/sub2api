# pnpm 11 起 pnpm.* 设置从 package.json 迁到 pnpm-workspace.yaml。
# 这里与 package.json 的 pnpm.overrides 保持逐字一致：
#   - pnpm 10 读 package.json 的 pnpm 字段
#   - pnpm 11 读本文件
# 两个版本解析出的 overrides 相同，依赖解析结果也就相同。
#
# pnpm 11 用 allowBuilds 取代 onlyBuiltDependencies：未显式允许的包，其安装脚本会被
# 拒绝（ERR_PNPM_IGNORED_BUILDS），esbuild 与 vue-demi 需要这些脚本才能正常工作。
overrides:
  "js-cookie": "3.0.7"
  "form-data@<4.0.6": ">=4.0.6"
  "postcss@<8.5.18": ">=8.5.18"
  "dompurify@<3.4.17": ">=3.4.17"
  "source-map-js@<1.2.2": ">=1.2.2"
  "follow-redirects@<1.16.2": ">=1.16.2"
  "decode-uri-component@<0.5.1": ">=0.5.1"

allowBuilds:
  esbuild: true
  vue-demi: true
